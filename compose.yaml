services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: local_catalog_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - catalog_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30
  mysql-test:
    image: mysql:8.4
    profiles: ['test']
    environment:
      MYSQL_DATABASE: catalog_test
      MYSQL_USER: catalog
      MYSQL_PASSWORD: test_catalog_password
      MYSQL_ROOT_PASSWORD: test_root_password
    ports:
      - '127.0.0.1:3307:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  catalog_data:
